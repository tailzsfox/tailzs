allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.layout.buildDirectory.set(file("../build"))

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("kotlin")) {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
            if (project.hasProperty("android")) {
                project.android.kotlinOptions {
                    def minimumSupportedVersion = org.gradle.util.GradleVersion.version("1.8")
                    if (languageVersion != null &&
                            org.gradle.util.GradleVersion.version(languageVersion) < minimumSupportedVersion) {
                        languageVersion = "1.8"
                    }
                    if (apiVersion != null &&
                            org.gradle.util.GradleVersion.version(apiVersion) < minimumSupportedVersion) {
                        apiVersion = "1.8"
                    }
                }
            }
        }

        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 35
                buildToolsVersion "35.0.0"
            }
        }

        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
    }
}

subprojects {
    project.layout.buildDirectory.set(file("${rootProject.layout.buildDirectory.get().asFile}/${project.name}"))
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
