plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '19'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'



def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.tailzs.app"
    compileSdkVersion 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.tailzs.app"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 19
        versionName "1.0.0"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (System.getenv()["CM_KEYSTORE_PATH"] ?: System.getenv()["CM_KEYSTORE"]) {
                storeFile file(System.getenv()["CM_KEYSTORE_PATH"] ?: System.getenv()["CM_KEYSTORE"])
                storePassword System.getenv()["CM_KEYSTORE_PASSWORD"]
                keyAlias System.getenv()["CM_KEY_ALIAS"]
                keyPassword System.getenv()["CM_KEY_PASSWORD"]
            } else if (keystorePropertiesFile.exists() && file(keystoreProperties['storeFile'] ?: "").exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            } else if (System.getenv("CM_KEYSTORE_PATH")) {
                keyAlias System.getenv("CM_KEY_ALIAS") ?: "tailzs-key"
                keyPassword System.getenv("CM_KEY_PASSWORD") ?: "Tailzs2026!"
                storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                storePassword System.getenv("CM_KEYSTORE_PASSWORD") ?: "Tailzs2026!"
            } else {
                throw new GradleException("CRITICAL: Production release signing key missing! Generic debug builds are strictly forbidden.")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
}
